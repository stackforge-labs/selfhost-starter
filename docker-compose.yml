# Self-hosting starter: Caddy reverse proxy + optional Cloudflare Tunnel.
# Usage: cp .env.example .env && docker compose up -d
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  whoami:
    image: traefik/whoami:v1.10.3
    restart: unless-stopped
    networks: [web]

  cloudflared:
    image: cloudflare/cloudflared:2024.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
